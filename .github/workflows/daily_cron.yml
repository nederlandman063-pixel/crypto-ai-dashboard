name: Daily crypto analysis and Pages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crypto-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: branch
        name: Record branch
        run: echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Generate daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/cron_pipeline.py
      - name: Validate generated JSON and diff scope
        run: |
          python -m json.tool data/reports.json >/dev/null
          python -m json.tool data/state.json >/dev/null
          unexpected="$(git diff --name-only | grep -Ev '^(data/reports\.json|data/state\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit and push generated data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data/reports.json data/state.json; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/reports.json data/state.json
          git commit -m "chore(data): add daily crypto analysis"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refetch."
            sleep $((attempt * 3))
          done
          echo "Unable to push generated data after three attempts." >&2
          exit 1

  deploy-pages:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest generated data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.analyze.outputs.branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build static Pages artifact
        run: python scripts/prepare_public.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
